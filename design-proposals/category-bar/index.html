<!DOCTYPE html>
<!--
  「题材栏」重新设计 · 5 套方案 + 现状基线
  ===========================================================================
  右边是模拟真实宽度的发现页顶栏，左边点选切换方案。
  每个方案的「栏高」是 JS 实测的（bar.offsetHeight），不是写死的数字。

  现状那一条刻意做成**完全按 ExploreView.tsx:373-409 原样复刻**：
  外层 slate 托盘 → 内层白盒(又一层 inset 阴影) → 横滚条，
  slice(0,8) 硬编码 8 个，「更多 24」展开后还是塞回同一条横滚里。
  点一下那条里的「更多 24」就能看到问题。

  零外链、零构建，双击即开。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>题材栏 · 重新设计 · 5 套方案</title>
<style>
:root{
  /* 抄自项目 src/styles/mica.css */
  --mica-bg:#f3f5f8;
  --accent:#0067c0;
  --slate-900:#0f172a; --slate-800:#1e293b; --slate-700:#334155; --slate-600:#475569;
  --slate-500:#64748b; --slate-400:#94a3b8; --slate-300:#cbd5e1;
  --slate-200:#e2e8f0; --slate-100:#f1f5f9; --slate-50:#f8fafc;
  --line:rgba(0,0,0,.06);
  --curve:cubic-bezier(.16,1,.3,1);
  --sh:0 4px 20px -2px rgba(0,0,0,.03),0 1px 3px rgba(0,0,0,.02);
  --sh-md:0 12px 32px -4px rgba(0,0,0,.07),0 2px 8px rgba(0,0,0,.03);
  --sh-lg:0 16px 40px -6px rgba(0,0,0,.09),0 2px 10px rgba(0,0,0,.03);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  display:grid;grid-template-columns:290px 1fr;overflow:hidden;
  font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--slate-700);-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1200px 800px at 15% 10%,rgba(224,239,255,.75) 0%,transparent 60%),
    radial-gradient(1000px 700px at 85% 85%,rgba(240,246,255,.85) 0%,transparent 60%),
    var(--mica-bg);
}
button{font:inherit;cursor:pointer}

/* ───────── 左侧 ───────── */
aside{border-right:1px solid var(--line);background:rgba(255,255,255,.80);backdrop-filter:blur(24px) saturate(180%);display:flex;flex-direction:column;min-height:0}
.ah{padding:18px 18px 13px;border-bottom:1px solid var(--line)}
.ah b{font-size:13px;font-weight:700;color:var(--slate-900);display:block;letter-spacing:-.01em}
.ah span{font-size:11px;color:var(--slate-400);line-height:1.65;display:block;margin-top:5px}
.ah code{font-family:Consolas,monospace;font-size:10.5px;color:var(--accent);background:rgba(0,103,192,.08);border-radius:4px;padding:1px 4px}
.list{flex:1;overflow-y:auto;padding:8px}
.item{width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:12px;padding:10px 12px;transition:.2s var(--curve);display:block;margin-bottom:2px}
.item:hover{background:rgba(0,0,0,.035)}
.item[aria-current="true"]{background:#fff;border-color:rgba(0,103,192,.22);box-shadow:0 2px 5px -1px rgba(0,0,0,.09),inset 0 1px 0 #fff}
.item .n{font-size:10px;font-weight:700;color:var(--accent);letter-spacing:.12em}
.item.base[aria-current="true"]{border-color:rgba(148,163,184,.45)}
.item.base .n{color:var(--slate-400)}
.item .t{font-size:13px;font-weight:600;color:var(--slate-900);margin:2px 0 3px}
.item .d{font-size:11px;color:var(--slate-400);line-height:1.55}
.af{padding:12px 16px;border-top:1px solid var(--line);font-size:10.5px;color:var(--slate-400);line-height:1.65}

/* ───────── 右侧 ───────── */
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:18px;padding:14px 20px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.55);backdrop-filter:blur(20px)}
.bar .ti{font-size:14px;font-weight:700;color:var(--slate-900);white-space:nowrap;letter-spacing:-.01em}
.bar .me{font-size:11.5px;color:var(--slate-500);line-height:1.5;margin-top:3px;max-width:min(42vw,480px)}
.bar .sp{margin-left:auto}
.stats{display:flex;gap:10px;flex:0 0 auto}
.stat{border-radius:12px;padding:7px 12px;min-width:96px;background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.95);box-shadow:var(--sh);text-align:right}
.stat .k{font-size:9.5px;color:var(--slate-400);font-weight:600;white-space:nowrap}
.stat .v{font-size:15px;font-weight:800;color:var(--slate-900);font-variant-numeric:tabular-nums;line-height:1.25}
.stat .v.good{color:#0f7b0f}
.stat .v.bad{color:#d13438}
.stat .v.warn{color:#b45309}

.stage{flex:1;min-height:0;padding:18px 20px 20px;overflow:hidden}
.window{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden;border-radius:14px;border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.72);backdrop-filter:blur(28px) saturate(180%);box-shadow:var(--sh-lg)}
.viewport{flex:1;min-height:0;overflow-y:auto}
.titlebar{flex:0 0 auto;height:34px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.6)}
.titlebar .dot{width:10px;height:10px;border-radius:50%;background:rgba(0,0,0,.07)}
.titlebar .tl{font-size:11px;color:var(--slate-400);font-weight:600;margin-left:4px}
.titlebar .tag{margin-left:auto;font-size:10px;color:var(--slate-400);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.page{padding:20px;display:flex;flex-direction:column;gap:20px}

/* ── 频道 Tab + 排序（所有方案共用，保证对比公平） ── */
.toptray{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tray-base{background-color:rgba(241,245,249,.9);border:1px solid rgba(226,232,240,.8);box-shadow:inset 0 1px 2px 0 rgba(0,0,0,.05);border-radius:12px;padding:4px;display:flex;align-items:center;gap:4px}
.tab{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;border:0;background:none;font-size:12px;font-weight:700;color:var(--slate-600);transition:all .15s var(--curve)}
.tab:hover{color:var(--slate-900);background:rgba(255,255,255,.5)}
.tab.on{background:linear-gradient(180deg,#fff,#f8fafc);border:1px solid rgba(203,213,225,.7);border-top-color:#fff;box-shadow:0 2px 5px -1px rgba(0,0,0,.09),0 1px 2px 0 rgba(0,0,0,.04),inset 0 1px 0 0 #fff;color:var(--accent);transform:translateY(-.5px)}
.tab.sort{padding:6px 12px;font-weight:500}
.tab.sort.on{font-weight:700}

/* ══════════ 题材栏：各方案 ══════════ */
.cbar{position:relative}
.cbar .lead{font-size:11px;font-weight:700;color:var(--slate-400);flex:0 0 auto;letter-spacing:.02em}
.chip{
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  padding:5px 11px;border-radius:8px;border:0;background:none;
  font-size:12px;color:var(--slate-600);transition:all .15s var(--curve)
}
.chip:hover{color:var(--slate-900);background:rgba(255,255,255,.6)}
.chip.on{
  background:linear-gradient(180deg,#fff,#f8fafc);border:1px solid rgba(203,213,225,.7);border-top-color:#fff;
  box-shadow:0 2px 5px -1px rgba(0,0,0,.09),0 1px 2px 0 rgba(0,0,0,.04),inset 0 1px 0 0 #fff;
  color:var(--accent);font-weight:700;transform:translateY(-.5px)
}
.chip .cnt{font-size:10px;font-weight:600;color:var(--slate-400);font-variant-numeric:tabular-nums}
.chip.on .cnt{color:rgba(0,103,192,.6)}
.pop{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;font-size:11px;font-weight:700;color:var(--slate-500);background:rgba(255,255,255,.75);border:1px solid rgba(226,232,240,.9);transition:all .15s}
.pop:hover{color:var(--accent);border-color:rgba(0,103,192,.3)}

/* 现状：盒中盒 + 硬编码 8 + 无溢出提示 */
.cbar-now{display:flex;flex-direction:column;gap:8px;padding:10px;background:rgba(241,245,249,.8);border:1px solid rgba(226,232,240,.7);border-radius:16px;box-shadow:inset 0 1px 2px 0 rgba(0,0,0,.05)}
.cbar-now .row{display:flex;align-items:center;gap:6px;font-size:12px}
.cbar-now .label{font-size:11px;font-weight:600;color:var(--slate-400);margin-right:4px}
.cbar-now .inner{display:flex;align-items:center;gap:4px;min-width:0;flex:1;overflow:hidden;border-radius:12px;border:1px solid rgba(226,232,240,.6);background:rgba(255,255,255,.6);padding:2px;box-shadow:inset 0 1px 2px 0 rgba(0,0,0,.05)}
.cbar-now .rail{display:flex;align-items:center;gap:4px;min-width:0;flex:1;overflow-x:auto;scrollbar-width:none}
.cbar-now .rail::-webkit-scrollbar{height:0}
.cbar-now .more{display:inline-flex;align-items:center;gap:4px;height:28px;flex:0 0 auto;border-radius:8px;border:0;border-left:1px solid rgba(226,232,240,.7);background:rgba(255,255,255,.75);padding:0 8px;font-size:11px;font-weight:600;color:var(--slate-500)}
.cbar-now .more:hover{color:var(--accent)}

/* A · 分段 + 溢出面板 */
.cbar-a{display:flex;align-items:center;gap:10px;padding:6px 8px;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.95);border-radius:14px;box-shadow:var(--sh)}
.cbar-a .seg{display:flex;align-items:center;gap:4px;min-width:0;flex:1;overflow:hidden}
.cbar-a .panel{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:40;padding:14px;border-radius:16px;background:rgba(255,255,255,.97);backdrop-filter:blur(30px) saturate(180%);border:1px solid rgba(255,255,255,.98);box-shadow:var(--sh-lg);display:none}
.cbar-a .panel.open{display:block;animation:drop .2s var(--curve)}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.cbar-a .panel .ph{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.cbar-a .panel .ph b{font-size:12px;color:var(--slate-900);font-weight:700}
.cbar-a .panel .ph span{font-size:10.5px;color:var(--slate-400)}
.cbar-a .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}

/* B · 换行铺满 */
.cbar-b{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.95);border-radius:14px;box-shadow:var(--sh)}
.cbar-b .wrap{display:flex;flex-wrap:wrap;gap:4px;min-width:0;flex:1}
.cbar-b .lead{margin-top:6px}

/* C · 横滚 + 渐隐 + 箭头 */
.cbar-c{display:flex;align-items:center;gap:8px;padding:6px 8px;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.95);border-radius:14px;box-shadow:var(--sh)}
.cbar-c .pin{flex:0 0 auto}
.cbar-c .railwrap{position:relative;min-width:0;flex:1}
.cbar-c .rail{display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:thin;scroll-behavior:smooth;padding:0 2px}
.cbar-c .rail::-webkit-scrollbar{height:5px}
.cbar-c .rail::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18);border-radius:999px}
.cbar-c .rail::-webkit-scrollbar-track{background:rgba(0,0,0,.04);border-radius:999px}
.cbar-c .fadeL,.cbar-c .fadeR{position:absolute;top:0;bottom:0;width:34px;pointer-events:none;z-index:2}
.cbar-c .fadeL{left:0;background:linear-gradient(90deg,rgba(255,255,255,.98),transparent)}
.cbar-c .fadeR{right:0;background:linear-gradient(270deg,rgba(255,255,255,.98),transparent)}
.cbar-c .arw{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:24px;height:24px;border-radius:50%;border:1px solid rgba(203,213,225,.8);background:rgba(255,255,255,.96);box-shadow:var(--sh);display:grid;place-items:center;color:var(--slate-600);font-size:13px;line-height:1}
.cbar-c .arw:hover{color:var(--accent)}
.cbar-c .arw.l{left:2px}
.cbar-c .arw.r{right:2px}

/* D · 分组标签墙 */
.cbar-d{display:flex;flex-direction:column;gap:8px;padding:12px;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.95);border-radius:14px;box-shadow:var(--sh)}
.cbar-d .grp{display:flex;align-items:flex-start;gap:10px}
.cbar-d .gt{flex:0 0 62px;font-size:10.5px;font-weight:700;color:var(--slate-400);padding-top:6px;letter-spacing:.04em}
.cbar-d .gc{display:flex;flex-wrap:wrap;gap:4px;min-width:0;flex:1}
.cbar-d .divider{height:1px;background:var(--line);margin:2px 0}

/* E · 受众 + 题材合并栏（顺手把死掉的 audience 筛选补上） */
.cbar-e{display:flex;flex-direction:column;gap:8px;padding:12px;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.95);border-radius:14px;box-shadow:var(--sh)}
.cbar-e .grp{display:flex;align-items:flex-start;gap:10px}
.cbar-e .gt{flex:0 0 62px;font-size:10.5px;font-weight:700;color:var(--slate-400);padding-top:6px;letter-spacing:.04em}
.cbar-e .gc{display:flex;flex-wrap:wrap;gap:4px;min-width:0;flex:1}
.cbar-e .divider{height:1px;background:var(--line);margin:2px 0}
.cbar-e .new{display:inline-flex;align-items:center;font-size:9.5px;font-weight:800;color:#0f7b0f;background:rgba(15,123,15,.1);border:1px solid rgba(15,123,15,.22);border-radius:6px;padding:1px 5px;margin-left:2px}

/* ── 内容假块 ── */
.shelf{display:flex;flex-direction:column;gap:12px}
.shelf-h{display:flex;align-items:flex-end;justify-content:space-between}
.shelf-h .l{display:flex;gap:8px;align-items:flex-start}
.shelf-h .barv{width:4px;height:20px;border-radius:999px;margin-top:3px;background:#f43f5e}
.shelf-h h2{font-size:15px;font-weight:800;color:var(--slate-900)}
.shelf-h p{font-size:11px;color:var(--slate-400);margin-top:2px}
.shelf-h .r{font-size:11px;color:var(--slate-400)}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.card{display:flex;flex-direction:column;gap:7px}
.card .cap b{font-size:12px;font-weight:700;color:var(--slate-900);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cap span{font-size:10.5px;color:var(--slate-400);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.poster{position:relative;width:100%;aspect-ratio:3/4;border-radius:14px;overflow:hidden;box-shadow:var(--sh)}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.42))}
.poster em{position:absolute;left:9px;right:9px;bottom:9px;z-index:1;font-style:normal;font-size:11px;font-weight:800;color:#fff;line-height:1.35;text-shadow:0 1px 4px rgba(0,0,0,.5)}

.probe-note{font-size:10.5px;color:var(--slate-400);display:flex;gap:6px;align-items:center}
.probe-note b{color:var(--slate-600)}

/* 现状问题高亮 */
.anno{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:#d13438;background:rgba(209,52,56,.08);border:1px solid rgba(209,52,56,.22);border-radius:7px;padding:2px 7px}
@media (max-width:1080px){
  body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  aside{max-height:32vh;border-right:0;border-bottom:1px solid var(--line)}
  .bar{flex-wrap:wrap}.bar .me{max-width:none}.stats{width:100%}
}
</style>
</head>
<body>

<aside>
  <div class="ah">
    <b>「题材栏」重新设计 · 5 套</b>
    <span>现状是 <code>ExploreView.tsx:373-409</code> 的原样复刻。右边「栏高」是 JS 实测的，不是估的。点一下现状那条里的「更多 24」就能看到它为什么不合理。</span>
  </div>
  <nav class="list" id="list"></nav>
  <div class="af">数据用 32 个真实站方题材名模拟。<br/>零外链，双击即开。</div>
</aside>

<main>
  <div class="bar">
    <div style="min-width:0">
      <div class="ti" id="ti">—</div>
      <div class="me" id="me">—</div>
    </div>
    <span class="sp"></span>
    <div class="stats">
      <div class="stat"><div class="k">栏高（实测）</div><div class="v" id="sH">—</div></div>
      <div class="stat"><div class="k">默认可见题材</div><div class="v" id="sV">—</div></div>
      <div class="stat"><div class="k">需要横向滚动</div><div class="v" id="sS">—</div></div>
      <div class="stat"><div class="k">最坏点击成本</div><div class="v" id="sC">—</div></div>
    </div>
  </div>

  <div class="stage">
    <div class="window">
      <div class="titlebar">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="tl">TTV Short Drama · 发现页</span>
        <span class="tag" id="wt">—</span>
      </div>
      <div class="viewport">
        <div class="page" id="page">

        <!-- 频道 + 排序：所有方案共用，不参与对比 -->
        <div class="toptray">
          <div class="tray-base">
            <button class="tab on">短剧专区</button>
            <button class="tab">漫剧次元</button>
            <button class="tab">神秘小窝</button>
          </div>
          <div class="tray-base">
            <button class="tab sort on">综合推荐</button>
            <button class="tab sort">最新上线</button>
            <button class="tab sort">热度榜单</button>
          </div>
        </div>

        <!-- ★ 题材栏：各方案挂载点 -->
        <div id="slot"></div>

        <!-- 内容假块 -->
        <section class="shelf">
          <div class="shelf-h">
            <div class="l"><span class="barv"></span><div><h2>正在热播</h2><p>当前专区热度靠前的短剧</p></div></div>
            <span class="r">本栏精选</span>
          </div>
          <div class="grid6" id="g1"></div>
        </section>

        </div>
      </div>
    </div>
  </div>
</main>

<script>
/* ═════════ 数据 ═════════ */
const CATS = ['全部','都市','战神','甜宠','逆袭','玄幻','古装','重生','复仇','萌宝','家庭','医术',
              '神豪','强者回归','年代','悬疑','脑洞','搞笑','校园','职场','情感','王妃','赘婿',
              '龙王','总裁','修仙','穿越','武侠','灵异','青春','乡村','军旅'];
/** 每题材的内容数，只是为了让「分段+面板」看起来像真的 */
const COUNTS = {};
CATS.forEach((c,i) => COUNTS[c] = c === '全部' ? 4820 : (320 - i * 7 + (i % 5) * 13));

const GRADS = [['#8b5cf6','#4338ca'],['#f43f5e','#7c2d12'],['#0ea5e9','#0f172a'],['#f59e0b','#b91c1c'],
               ['#10b981','#065f46'],['#6366f1','#1e1b4b']];
const TITLES = ['龙王归来','隐婚总裁','闪婚老公','千金归来','赘婿逆袭','神级保安'];
function posterHTML(i){
  const g = GRADS[i % GRADS.length];
  return `<div class="poster" style="background-image:linear-gradient(150deg,${g[0]},${g[1]})"><em>${TITLES[i%TITLES.length]}</em></div>`;
}
function cardHTML(i){
  return `<div class="card">${posterHTML(i)}<div class="cap"><b>${TITLES[i%TITLES.length]}</b><span>${90+i*3} 集 · ${CATS[(i+1)%CATS.length]}</span></div></div>`;
}
document.getElementById('g1').innerHTML = Array.from({length:6},(_,i)=>cardHTML(i)).join('');

/* 分组映射（方案 D 用）。站方题材名是动态的，所以必须有「其他」兜底。 */
const GROUPS = [
  ['高频', ['全部','都市','战神','甜宠','逆袭','玄幻','古装','重生']],
  ['人设', ['赘婿','龙王','总裁','王妃','神豪','强者回归','弃女','豪门']],
  ['设定', ['穿越','修仙','武侠','灵异','校园','年代','职场','脑洞']],
];
function grouped(){
  const used = new Set(GROUPS.flatMap(g=>g[1]));
  const rest = CATS.filter(c=>!used.has(c));
  return [...GROUPS, ['其他', rest]];
}

/* ═════════ 公共片段 ═════════ */
const CHEV = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const UP   = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>';
const ARRL = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
const ARRR = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

function chip(c, on, withCount){
  const k = c === (on || '全部') ? 'chip on' : 'chip';
  return `<button class="${k}">${c}${withCount ? `<span class="cnt">${COUNTS[c]}</span>` : ''}</button>`;
}
function chipList(list, on, withCount){
  return list.map(c => chip(c, on, withCount)).join('');
}

/* ══════════════════════════ 5 套方案 ══════════════════════════ */

/* ── 现状：原样复刻 ExploreView.tsx:373-409 ── */
function renderNow(){
  return `<div class="cbar cbar-now" id="barRoot">
    <div class="row">
      <span class="label">题材:</span>
      <div class="inner">
        <div class="rail" id="railNow">${chipList(CATS.slice(0,8), '全部')}</div>
        <button class="more" id="btnMore">更多 ${CATS.length - 8} ${CHEV}</button>
      </div>
    </div>
  </div>`;
}
function bindNow(){
  const b = document.getElementById('btnMore');
  const rail = document.getElementById('railNow');
  if(!b || !rail) return;
  b.addEventListener('click', () => {
    const expanded = b.dataset.x === '1';
    b.dataset.x = expanded ? '0' : '1';
    rail.innerHTML = chipList(expanded ? CATS.slice(0,8) : CATS, '全部');
    b.innerHTML = expanded ? `更多 ${CATS.length-8} ${CHEV}` : `收起 ${UP}`;
    document.getElementById('wt').textContent = expanded ? '默认态' : '展开态：全部 32 个挤回同一条横滚里';
  });
}

/* ── A · 分段 + 溢出面板 ── */
function renderA(){
  const inline = CATS.slice(0, 8);
  return `<div class="cbar cbar-a" id="barRoot">
    <span class="lead">题材</span>
    <div class="seg">${chipList(inline, '全部')}</div>
    <button class="pop" id="btnA">全部题材 <b style="color:var(--slate-900)">${CATS.length}</b> ${CHEV}</button>
    <div class="panel" id="panelA">
      <div class="ph"><b>全部题材</b><span>点击任意题材即筛选题材 · 共 ${CATS.length} 个</span></div>
      <div class="pgrid">${CATS.map(c => `<button class="chip" style="justify-content:center">${c}<span class="cnt">${COUNTS[c]}</span></button>`).join('')}</div>
    </div>
  </div>`;
}
function bindA(){
  const b = document.getElementById('btnA');
  const p = document.getElementById('panelA');
  if(!b || !p) return;
  b.addEventListener('click', e => { e.stopPropagation(); p.classList.toggle('open'); });
  // 自摘除：面板节点每次 draw 都会重建，挂着不走的监听器会越积越多
  const closer = e => {
    if(!document.contains(p)){ document.removeEventListener('click', closer); return; }
    if(!p.contains(e.target) && e.target !== b) p.classList.remove('open');
  };
  document.addEventListener('click', closer);
}

/* ── B · 换行铺满 ── */
function renderB(){
  return `<div class="cbar cbar-b" id="barRoot">
    <span class="lead">题材</span>
    <div class="wrap">${chipList(CATS, '全部')}</div>
  </div>`;
}

/* ── C · 横滚 + 左右渐隐 + 箭头，左端固定「全部」 ── */
function renderC(){
  return `<div class="cbar cbar-c" id="barRoot">
    <button class="chip on pin">全部</button>
    <div class="railwrap">
      <div class="rail" id="railC">${chipList(CATS.slice(1), '全部')}</div>
      <div class="fadeL"></div><div class="fadeR"></div>
      <button class="arw l" id="arwL">${ARRL}</button>
      <button class="arw r" id="arwR">${ARRR}</button>
    </div>
  </div>`;
}
function bindC(){
  const r = document.getElementById('railC');
  const L = document.getElementById('arwL'), R = document.getElementById('arwR');
  if(!r) return;
  const step = () => Math.max(220, r.clientWidth * 0.7);
  L && L.addEventListener('click', () => r.scrollBy({ left: -step(), behavior:'smooth' }));
  R && R.addEventListener('click', () => r.scrollBy({ left:  step(), behavior:'smooth' }));
  const sync = () => {
    const atStart = r.scrollLeft <= 2;
    const atEnd = r.scrollLeft + r.clientWidth >= r.scrollWidth - 2;
    if(L) L.style.opacity = atStart ? '.35' : '1';
    if(R) R.style.opacity = atEnd ? '.35' : '1';
    document.querySelector('.cbar-c .fadeL').style.opacity = atStart ? '0' : '1';
    document.querySelector('.cbar-c .fadeR').style.opacity = atEnd ? '0' : '1';
  };
  r.addEventListener('scroll', sync);
  window.addEventListener('resize', sync);
  sync();
}

/* ── D · 分组标签墙 ── */
function renderD(){
  const groups = grouped();
  return `<div class="cbar cbar-d" id="barRoot">
    ${groups.map(([name, list], gi) => `
      ${gi > 0 ? '<div class="divider"></div>' : ''}
      <div class="grp">
        <span class="gt">${name}</span>
        <div class="gc">${chipList(list, '全部')}</div>
      </div>`).join('')}
  </div>`;
}

/* ── E · 受众 + 题材合并栏（补上 store 里死掉的 audience 筛选） ── */
function renderE(){
  const aud = ['全部','男频','女频'];
  return `<div class="cbar cbar-e" id="barRoot">
    <div class="grp">
      <span class="gt">受众</span>
      <div class="gc">${aud.map(a => `<button class="chip${a === '全部' ? ' on' : ''}">${a}</button>`).join('')}</div>
    </div>
    <div class="divider"></div>
    <div class="grp">
      <span class="gt">题材</span>
      <div class="gc">${chipList(CATS, '全部')}</div>
    </div>
  </div>`;
}

/* ══════════════════════════ 方案表 ══════════════════════════ */
const MODES = [
  { id:'now', n:'00', t:'现状（基线）', base:true,
    d:'三层盒套（托盘→白盒→横滚条，两层 inset 阴影叠着）+ 硬编码 slice(0,8) + 溢出无提示。点「更多 24」看展开后的样子。',
    me:'注意：「更多」只是把 8 个放开成 32 个，**仍然塞回同一条横滚里**，滚动条 0px 高，用户不知道右边还有东西',
    visible:'8 / 32', scroll:'是（展开后）', clicks:'1 次 + 还要横滑找', cls:{s:'bad', c:'bad'} },

  { id:'A', n:'A', t:'分段 + 溢出面板',
    d:'第一行只放高频题材，末尾一个「全部题材 32」按钮。点开是正规面板：自适应网格铺满全部，每项带内容数。',
    me:'溢出从"隐形"变成"可见"，且全量题材有了正经容器。代价：冷门题材多一次点击',
    visible:'8 / 32', scroll:'否', clicks:'1 次点击，无需滑动', cls:{s:'good', c:'good'} },

  { id:'B', n:'B', t:'换行铺满',
    d:'取消横滚，全部题材 flex-wrap 铺开。32 个题材在正常窗口宽度下大概占两行。',
    me:'零交互成本、一眼看全、彻底消灭横滚。代价：吃掉纵向高度（看实测栏高）',
    visible:'32 / 32', scroll:'否', clicks:'0 次点击', cls:{s:'warn', c:'good'} },

  { id:'C', n:'C', t:'横滚 + 渐隐 + 箭头',
    d:'保留横滚，但把「还有内容」变得可见：右端渐隐遮罩、左右圆形箭头、可见的细滚动条；「全部」固定在左端不参与滚动。',
    me:'改动最小、纵向零成本。代价：仍然是横滚，找第 25 个题材还是要滑',
    visible:'约 12 / 32', scroll:'是（但可见）', clicks:'1 次横滑若干次', cls:{s:'good', c:'warn'} },

  { id:'D', n:'D', t:'分组标签墙',
    d:'32 个题材第一次有了结构：按「高频 / 人设 / 设定」分组，每组带组标题，自动折行。站方新增的题材落进「其他」。',
    me:'找东西最快。代价：要维护分组映射表，且站方题材名是动态的，必须留「其他」兜底',
    visible:'32 / 32', scroll:'否', clicks:'0 次点击', cls:{s:'warn', c:'good'} },

  { id:'E', n:'E', t:'受众 + 题材合并栏',
    d:'两组塞进同一个容器：上排「受众：全部 / 男频 / 女频」，下排题材折行铺满。顺手把 store 里存在却没有任何界面的受众筛选补上。',
    me:'既解决溢出，又修掉一个真 bug：audience 在 useCatalogStore 里、也参与了请求键，但全项目 setAudience 零调用点，等于一条死筛选',
    visible:'32 / 32', scroll:'否', clicks:'0 次点击', cls:{s:'warn', c:'good'} },
];

/* ══════════════════════════ 渲染 ══════════════════════════ */
const slot = document.getElementById('slot');
const RENDER = { now:renderNow, A:renderA, B:renderB, C:renderC, D:renderD, E:renderE };
const BIND   = { now:bindNow, A:bindA, C:bindC };

function draw(id){
  slot.innerHTML = RENDER[id]();
  const root = document.getElementById('barRoot');
  if(BIND[id]) BIND[id]();
  return root ? Math.round(root.getBoundingClientRect().height) : 0;
}

/* 栏高实测：当前方案 vs 现状基线，两边都真渲染一次再量 */
function measure(id){
  const h = draw(id);
  const hBase = id === 'now' ? h : draw('now');
  draw(id);
  return { h, delta: h - hBase };
}

const list = document.getElementById('list');
list.innerHTML = MODES.map((m,i)=>`<button class="item${m.base?' base':''}" data-i="${i}" aria-current="${i===0}">
  <div class="n">${m.n}</div><div class="t">${m.t}</div><div class="d">${m.d}</div></button>`).join('');

let cur = -1;
function show(i){
  cur = (i + MODES.length) % MODES.length;
  const m = MODES[cur];
  const r = measure(m.id);

  document.getElementById('ti').textContent = `${m.n} · ${m.t}`;
  document.getElementById('me').textContent = m.me;
  document.getElementById('wt').textContent = m.t;

  const hEl = document.getElementById('sH');
  const sign = r.delta > 0 ? '+' : '';
  hEl.textContent = `${r.h} px` + (r.delta === 0 ? '' : `（${sign}${r.delta}）`);
  hEl.className = 'v ' + (m.base ? 'bad' : r.delta > 12 ? 'warn' : 'good');

  const vEl = document.getElementById('sV'); vEl.textContent = m.visible;
  vEl.className = 'v ' + (m.visible.startsWith('32') ? 'good' : 'warn');
  const sEl = document.getElementById('sS'); sEl.textContent = m.scroll;
  sEl.className = 'v ' + (m.scroll === '否' ? 'good' : 'bad');
  const cEl = document.getElementById('sC'); cEl.textContent = m.clicks;
  cEl.className = 'v ' + (m.clicks === '0 次点击' ? 'good' : 'warn');

  list.querySelectorAll('.item').forEach(b=>b.setAttribute('aria-current', String(+b.dataset.i === cur)));
  const act = list.querySelector('.item[aria-current="true"]');
  act && act.scrollIntoView({ block:'nearest' });
}

list.addEventListener('click', e => {
  const b = e.target.closest('.item');
  if(b) show(+b.dataset.i);
});
addEventListener('keydown', e => {
  if(e.key === 'ArrowDown') show(cur + 1);
  if(e.key === 'ArrowUp')   show(cur - 1);
});

show(0);
</script>
