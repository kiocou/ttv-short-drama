[package]
name = "mf-vsr-probe"
version = "0.1.0"
edition = "2021"
description = "最小验证程序：Media Foundation 解码 + D3D11 VideoProcessor 呈现，用来判定这条链能否触发 RTX VSR"

[dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
] }
