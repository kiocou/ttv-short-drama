name: CI

# 触发时机：推送到 main、针对 main 的 PR、以及手动触发。
# 项目是 Windows 专属（WebView2 / Mica / DWM 合成），因此跑在 windows-latest。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的重复推送只保留最新一次运行，避免排队堆积。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: 前端（类型检查 + 构建）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 用 ci 而不是 install：严格按 package-lock.json 安装，
      # 保证 CI 结果与本地一致，也避免锁文件被静默改写。
      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 生产构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7

  rust:
    name: Rust（格式 + Clippy + 测试）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 补齐随包资源占位。
      #
      # 这些资源是第三方大体积二进制（ffmpeg.exe 约 102MB、嵌入式 Python 约
      # 21.5MB、worker 依赖约 15.8MB），已由 .gitignore 排除，克隆后并不存在。
      # 但 src-tauri/tauri.conf.json 的 bundle.resources 声明了它们，
      # tauri-build 会校验路径存在性——缺失时构建直接失败：
      #     error: resource path `resources\python` doesn't exist（退出码 101）
      # 因此这里创建占位路径让编译得以进行。
      #
      # 注意：CI 只验证「代码能否编译与通过测试」，不产出可发布安装包——
      # 真正的打包需要补齐上述真实资源。
      - name: 创建资源占位
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/resources/python | Out-Null
          Set-Content -Path src-tauri/resources/python/PLACEHOLDER.txt -Value 'ci placeholder: 真实资源由 README「资源恢复」章节补齐'
          New-Item -ItemType Directory -Force -Path src-tauri/resources/mpv | Out-Null
          Set-Content -Path src-tauri/resources/mpv/ffmpeg.exe -Value ''

      - name: 格式检查
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # 只跑 --bins：单元测试是纯逻辑测试（分页解析、缓存淘汰、凭据处理），
      # 不需要网络、设备凭据或上面那些占位资源。
      # 需要联网的 catalog_pagination_live 标记为 #[ignore]，默认跳过。
      - name: 单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --bins
