name: CI

# 触发时机：推送到 main、针对 main 的 PR、以及手动触发。
# 项目是 Windows 专属（WebView2 / Mica / DWM 合成），因此跑在 windows-latest。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的重复推送只保留最新一次运行，避免排队堆积。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: 前端（类型检查 + 构建）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 用 ci 而不是 install：严格按 package-lock.json 安装，
      # 保证 CI 结果与本地一致，也避免锁文件被静默改写。
      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 生产构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7

  rust:
    name: Rust（格式 + Clippy + 测试）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 校验随包资源
        shell: pwsh
        run: |
          $required = @(
            'src-tauri/resources/python/python.exe',
            'src-tauri/resources/shortdrama-worker/worker.py',
            'src-tauri/resources/mpv/ffmpeg.exe'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "缺少随包资源: $path"
            }
          }

      - name: 格式检查
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # 只跑 --bins：单元测试是纯逻辑测试（分页解析、缓存淘汰、凭据处理），
      # 不需要网络或设备凭据。
      # 需要联网的 catalog_pagination_live 标记为 #[ignore]，默认跳过。
      - name: 单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --bins
